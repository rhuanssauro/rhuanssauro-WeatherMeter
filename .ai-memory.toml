# Own memory marker. The closest .ai-memory.toml wins, so sessions
# started in this tree no longer use the parent marker at
# ~/projects/personal/Github-rhuan/.ai-memory.toml.
# Recall stays on this project. Cross-project recall is off.
workspace = "github-rhuan"
project_strategy = "repo-root"

[recall]
default_global = "false"

[briefing]
inject_on_session_start = "true"
max_chars = 4000

[capture]
ignore_paths = [

  "**/CREDENTIALS*",
  "**/*credential*",
  "**/*.vault.yaml",
  "**/.env",
  "**/.env.*",
  "**/secrets/**",
  "**/*.pem",
  "**/*.key",
]
